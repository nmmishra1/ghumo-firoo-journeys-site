    <!-- Add error handling for global errors -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', e.error, e.filename, e.lineno, e.colno);
        
        // Additional logging for script errors
        if (e.filename && e.filename.includes('b2bta-production')) {
          console.error('External script error detected from:', e.filename);
        }
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });

      // Track when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM fully loaded');
      });
    </script>
  </head>

  <body>
