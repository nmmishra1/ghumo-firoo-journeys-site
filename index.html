
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghumo Firoo Travels - Your Journey Begins Here</title>
    <meta name="description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages including Char Dham Yatra, Turkey, Dubai and more." />
    <meta name="author" content="Ghumo Firoo Travels" />

    <meta property="og:title" content="Ghumo Firoo Travels - Your Journey Begins Here" />
    <meta property="og:description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ghumofiroo.com/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ghumofiroo.com/logo.png" />
    
    <!-- Required custom CSS -->
    <link rel="stylesheet" href="https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/style.css" onerror="console.log('Failed to load custom CSS')">
    
    <!-- Add error handling for global errors -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', e.error, e.filename, e.lineno, e.colno);
        
        // Additional logging for script errors
        if (e.filename && e.filename.includes('b2bta-production')) {
          console.error('External script error detected from:', e.filename);
        }
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });

      // Track when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM fully loaded');
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Load custom JavaScript with enhanced error handling -->
    <script>
      // Wait for the React app to fully load before loading external scripts
      window.addEventListener('load', function() {
        console.log('Window fully loaded, now loading custom script...');
        
        // Add a small delay to ensure React app is fully initialized
        setTimeout(function() {
          try {
            var script = document.createElement('script');
            script.src = 'https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/custom.js';
            script.crossOrigin = 'anonymous'; // Add crossorigin attribute for better error reporting
            
            script.onerror = function(e) {
              console.warn('Failed to load custom JavaScript - continuing without it. Error:', e);
              // Don't throw an error, just continue without the script
            };
            
            script.onload = function() {
              console.log('Custom JavaScript loaded successfully');
            };
            
            // Only append if we have a login button to avoid unnecessary loading
            var loginButton = document.getElementById('b2bLoginButton');
            if (loginButton || document.querySelector('[id="b2bLoginButton"]')) {
              document.body.appendChild(script);
              console.log('Login button found, loading custom script');
            } else {
              console.log('No login button found yet, will retry...');
              // Retry after a short delay in case the React component hasn't rendered yet
              setTimeout(function() {
                var retryButton = document.getElementById('b2bLoginButton');
                if (retryButton) {
                  document.body.appendChild(script);
                  console.log('Login button found on retry, loading custom script');
                }
              }, 1000);
            }
          } catch (error) {
            console.warn('Error setting up custom script:', error);
            // Don't re-throw the error to prevent it from breaking the app
          }
        }, 500);
      });
    </script>
  </body>
</html>
