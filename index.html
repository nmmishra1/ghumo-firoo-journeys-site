
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghumo Firoo Travels - Your Journey Begins Here</title>
    <meta name="description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages including Char Dham Yatra, Turkey, Dubai and more." />
    <meta name="author" content="Ghumo Firoo Travels" />

    <meta property="og:title" content="Ghumo Firoo Travels - Your Journey Begins Here" />
    <meta property="og:description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ghumofiroo.com/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ghumofiroo.com/logo.png" />
    
    <!-- B2B Login Modal CSS as per integration guide -->
    <link rel="stylesheet" href="https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/style.css">
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Load React application first -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- B2B Login Modal JavaScript with error isolation -->
    <script>
      // Wait for DOM to be fully loaded before attempting to load external script
      document.addEventListener('DOMContentLoaded', function() {
        // Add a delay to ensure React has mounted
        setTimeout(function() {
          try {
            console.log('Loading B2B login script...');
            
            var script = document.createElement('script');
            script.src = 'https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/custom.js';
            script.async = true;
            
            script.onload = function() {
              console.log('B2B login script loaded successfully');
            };
            
            script.onerror = function(error) {
              console.warn('B2B login script failed to load:', error);
              // Prevent error from propagating to the main application
              return true;
            };
            
            document.body.appendChild(script);
            
          } catch (error) {
            console.warn('Error loading B2B script:', error);
            // Don't let this error crash the app
          }
        }, 1000); // 1 second delay to ensure React is mounted
      });
    </script>
  </body>
</html>
