
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghumo Firoo Travels - Your Journey Begins Here</title>
    <meta name="description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages including Char Dham Yatra, Turkey, Dubai and more." />
    <meta name="author" content="Ghumo Firoo Travels" />

    <meta property="og:title" content="Ghumo Firoo Travels - Your Journey Begins Here" />
    <meta property="og:description" content="Discover amazing destinations with Ghumo Firoo Travels. Domestic and international tour packages." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ghumofiroo.com/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ghumofiroo.com/logo.png" />
    
    <!-- Required custom CSS with better error handling -->
    <link rel="stylesheet" href="https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/style.css" onerror="console.warn('Failed to load custom CSS - continuing without it')">
    
    <!-- Enhanced error handling -->
    <script>
      // Prevent external scripts from breaking the app
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', e.error, e.filename, e.lineno, e.colno);
        
        // Don't let external script errors break the app
        if (e.filename && e.filename.includes('b2bta-production')) {
          console.warn('External script error - continuing without custom functionality');
          e.preventDefault();
          return true;
        }
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
        // Don't let promise rejections break the app
        e.preventDefault();
      });

      // Track when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM fully loaded');
      });

      // Ensure React always loads
      window.addEventListener('load', function() {
        console.log('Window loaded - React should be mounting');
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Load React first -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Load custom JavaScript after React with enhanced error handling -->
    <script>
      // Load external script safely without blocking React
      (function() {
        try {
          var script = document.createElement('script');
          script.src = 'https://b2bta-production.s3.ap-south-1.amazonaws.com/whitelabel/custom.js';
          script.onerror = function() {
            console.warn('Failed to load custom JavaScript - login button will not have custom functionality');
          };
          script.onload = function() {
            console.log('Custom JavaScript loaded successfully');
          };
          document.body.appendChild(script);
        } catch (error) {
          console.warn('Error loading custom script:', error);
        }
      })();
    </script>
  </body>
</html>
