name: Auto-Deploy Ghumo Firoo to Live cPanel Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build Production Bundle & Bundle PHP Backend
        run: |
          npm run build
          node scripts/copy-backend.mjs

      - name: 🔐 Generate Production Database Config (if secret is configured)
        if: env.HAS_DB_SECRET == 'true'
        env:
          HAS_DB_SECRET: ${{ secrets.MYSQL_PASSWORD != '' }}
          DB_PASS: ${{ secrets.MYSQL_PASSWORD }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          cat << EOF > dist/php-backend/db_config.php
          <?php
          return [
              'MYSQL_HOST'     => 'localhost',
              'MYSQL_DATABASE' => 'a17511nd_Ghumofiroo',
              'MYSQL_USER'     => 'a17511nd_Ghumofiroo_live',
              'MYSQL_PASSWORD' => '$DB_PASS',
              'SUPABASE_JWT_SECRET' => '$SUPABASE_SECRET',
          ];
          EOF
          cp dist/php-backend/db_config.php dist/public_html/php-backend/db_config.php || true

      - name: 📂 Deploy Everything to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: standard
          timeout: 600000
          exclude: |
            **/php-backend/uploads/**
            **/php-backend/db_config.php
            **/php-backend/.env

