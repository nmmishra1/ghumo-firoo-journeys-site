name: Auto-Deploy Ghumo Firoo to Live cPanel Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build Production Bundle & Bundle PHP Backend
        run: |
          npm run build
          node scripts/copy-backend.mjs

      - name: 📂 Deploy Everything to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ./
          local-dir: ./dist/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/php-backend/uploads/**
