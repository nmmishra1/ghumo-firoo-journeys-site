; Ghumo Firoo Journeys - Shared Hosting INI Configuration (php.ini)
; Automatically loaded by cPanel / Apache SuPHP

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 32M
post_max_size = 32M
display_errors = Off
log_errors = On

; OPcache settings
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
